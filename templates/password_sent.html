<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Email Sent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      background: linear-gradient(120deg, #eaf6f0 0%, #f5f5f3 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .header-bar {
  width: 100vw;
  background: #2c4c47;
  color: #fff;
  padding: 24px 0 20px 0;
  text-align: center;
  font-size: 1.6rem;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 0;
  box-shadow: 0 2px 10px rgba(44, 76, 71, 0.12);
  z-index: 10;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px; /* space between logo and text */
}

.header-logo {
  height: 32px;
  width: 32px;
  object-fit: contain;
  background: transparent;
  display: inline-block;
}

.header-title {
  display: inline-block;
}

    .success-card {
      margin-top: 60px;
      margin-bottom: 60px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 8px 32px rgba(44, 76, 71, 0.13);
      border-radius: 18px;
      padding: 38px 32px 32px 32px;
      max-width: 500px;
      width: 96vw;
      backdrop-filter: blur(7px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 1.5px solid #eaf6f0;
      animation: fadeInUp 0.8s ease;
      text-align: center;
    }
    .success-card h2 {
      margin-bottom: 18px;
      color: #2c4c47;
      font-size: 2rem;
      font-weight: 700;
    }
    .success-card p {
      color: #23413b;
      font-size: 1.08rem;
      margin-bottom: 10px;
    }
    .back-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 25px;
      font-size: 1rem;
      color: #fff;
      background-color: #2c4c47;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      transition: background-color 0.3s ease;
      box-shadow: 0 2px 10px rgba(44, 76, 71, 0.10);
    }
    .back-btn:hover {
      background-color: #1e3330;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 600px) {
      .success-card {
        padding: 20px 6px 18px 6px;
        margin-top: 24px;
        margin-bottom: 24px;
      }
      .header-bar {
        font-size: 1.1rem;
        padding: 16px 0 12px 0;
      }
    }
  </style>
</head>
<body>
<div class="header-bar">
  <img src="static/images/deepdx.png" alt="DeepDx Logo" class="header-logo" />
  <span class="header-title">DeepDx</span>
</div>  <div class="success-card">
    <h2>☑️ Email Sent Successfully</h2>
    <p>A reset password link has been sent to your registered email.</p>
    <p>Please check your spam or junk folder to ensure you haven't missed our email.</p>
    <a href="{{ url_for('login') }}" class="back-btn">Back to Login</a>
  </div>
</body>
</html>
