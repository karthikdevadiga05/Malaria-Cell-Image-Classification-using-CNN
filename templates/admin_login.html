<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Login | Malaria Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #eaf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }
    /* Background image with overlay and blur */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: url('/static/images/bg-lab.jpg') center center/cover no-repeat;
      opacity: 0.9;
      z-index: 0;
      filter: blur(1px);
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(120deg, #eaf6f0 0%, #f5f5f3 100%);
      opacity: 0.8;
      z-index: 1;
      pointer-events: none;
    }
   .header-bar {
  width: 100vw;
  background: #2c4c47;
  color: #fff;
  padding: 24px 0 20px 0;
  text-align: center;
  font-size: 1.6rem;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 0;
  box-shadow: 0 2px 10px rgba(44, 76, 71, 0.12);
  z-index: 10;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px; /* space between logo and text */
}

.header-logo {
  height: 32px;
  width: 32px;
  object-fit: contain;
  background: transparent;
  display: inline-block;
}

.header-title {
  display: inline-block;
}

    .back-link {
      position: absolute;
      left: 30px;
      top: 32px;
      z-index: 20;
      font-size: 1rem;
      background: rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 7px 16px;
      box-shadow: 0 2px 8px rgba(44, 76, 71, 0.10);
      transition: background 0.2s;
    }
    .back-link a {
      color: #2c4c47;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .back-link:hover {
      background: #eaf6f0;
    }
    /* Animated admin card */
    .admin-card {
      margin-bottom: 40px;
      margin-top: 40px;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 10px 36px rgba(44, 76, 71, 0.17), 0 2px 8px rgba(44, 76, 71, 0.10);
      border-radius: 20px;
      padding: 38px 28px 28px 28px;
      max-width: 420px;
      width: 92vw;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 1.5px solid #eaf6f0;
      z-index: 2;
      opacity: 0;
      transform: translateY(60px) scale(0.97);
      animation: cardFadeIn 1.2s cubic-bezier(.42,0,.58,1) 0.1s forwards;
      box-sizing: border-box;
    }
    @keyframes cardFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .admin-card:hover {
      box-shadow: 0 20px 48px rgba(44, 76, 71, 0.23), 0 2px 8px rgba(44, 76, 71, 0.10);
      transform: translateY(-6px) scale(1.015);
      transition: box-shadow 0.3s, transform 0.3s;
    }
    .admin-card h3 {
      color: #2c4c47;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
      text-align: center;
    }
    .admin-card h2 {
      color: #23413b;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 32px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .admin-card h4 {
      color: #1e3330;
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 0.1px;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      color: #2c4c47;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
    }
    input[type="text"], input[type="password"] {
      width: 83%;
      padding: 12px 42px 12px 15px;
      margin-bottom: 18px;
      border: 1.5px solid #cbe6f1;
      border-radius: 8px;
      background: #f5f5f3;
      font-size: 1rem;
      color: #1a1a1a;
      transition: border 0.2s, background 0.2s;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #2c4c47;
      background: #eaf6f0;
    }
    .input-group {
      position: relative;
      width: 100%;
    }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      outline: none;
      height: 24px;
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-btn svg {
      width: 22px;
      height: 22px;
      fill: #2c4c47;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .eye-btn:hover svg {
      opacity: 1;
    }
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(90deg, #2c4c47 60%, #0f90c9 100%);
      color: #fff;
      font-size: 1.08rem;
      font-weight: 700;
      padding: 13px 0;
      border: none;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 8px;
      box-shadow: 0 2px 10px rgba(44, 76, 71, 0.10);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    button[type="submit"]:hover {
      background: linear-gradient(90deg, #1e3330 60%, #1976d2 100%);
      box-shadow: 0 8px 24px rgba(44, 76, 71, 0.16);
    }
    .flash {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 1rem;
      text-align: center;
    }
    .flash.success {
      background: #d4edda;
      color: #256029;
    }
    .flash.error, .flash.danger {
      background: #ffcdd2;
      color: #b71c1c;
    }
    @media (max-width: 600px) {
      .admin-card {
        padding: 30px 10px 20px 10px;
        margin-top: 30px;
      }
      .header-bar {
        font-size: 1.1rem;
        padding: 16px 0 12px 0;
      }
      .back-link {
        left: 10px;
        top: 12px;
        font-size: 0.95rem;
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>
<div class="header-bar">
  <img src="static/images/deepdx.png" alt="DeepDx Logo" class="header-logo" />
  <span class="header-title">DeepDx</span>
</div>  <div class="back-link">
    <a href="{{ url_for('landing') }}">&larr; Back to Home</a>
  </div>
  <div class="admin-card">
    <h3>Admin Panel</h3>
    <h2>Secure Access Only</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <label for="username">
        <img src="{{ url_for('static', filename='images/user.png') }}" alt="User Icon"
          style="width: 20px; height: 22px; vertical-align: middle; margin-right: 8px;">
        Admin ID
      </label>
      <div class="input-group">
        <input type="text" name="username" placeholder="Admin ID" required>
      </div>
      <label for="password">
        <img src="{{ url_for('static', filename='images/padlock.png') }}" alt="Padlock Icon"
          style="width: 20px; height: 22px; vertical-align: middle; margin-right: 8px;">
        Password
      </label>
      <div class="input-group">
        <input type="password" name="password" id="passwordInput" placeholder="Password" required>
        <button type="button" class="eye-btn" tabindex="-1" onclick="togglePassword()" aria-label="Show/Hide password">
          <svg id="eyeOpen" style="display:block" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 13c-3.87 0-7.19-2.54-8.47-6C4.81 7.04 8.13 4.5 12 4.5s7.19 2.54 8.47 6c-1.28 3.46-4.6 6-8.47 6zm0-10a4 4 0 100 8 4 4 0 000-8zm0 6.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/>
          </svg>
          <svg id="eyeClosed" style="display:none" viewBox="0 0 24 24">
            <path d="M12 6c-3.31 0-6.31 1.92-8 5 1.17 2.09 3.09 3.73 5.39 4.46l-1.43 1.43C5.07 15.19 3.13 13.74 2 12c1.73-4.39 6-7.5 11-7.5 1.61 0 3.16.31 4.59.89l-1.43 1.43C15.31 7.92 13.69 7.5 12 7.5V6zm10.19 16.19l-1.41 1.41-2.19-2.19C16.31 20.08 14.69 20.5 13 20.5c-5 0-9.27-3.11-11-7.5 1.13-1.74 3.07-3.19 5.16-3.89l-1.43-1.43C2.73 7.61 7 4.5 12 4.5c1.69 0 3.31.42 4.76 1.18l2.19-2.19 1.41 1.41-19 19z"/>
          </svg>
        </button>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    function togglePassword() {
      const pwdInput = document.getElementById("passwordInput");
      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
      } else {
        pwdInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
      }
    }
  </script>
</body>
</html>
