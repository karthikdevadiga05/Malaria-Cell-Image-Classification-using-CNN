<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts for consistency -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #eaf6f0;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: url('/static/images/bg-lab.jpg') center center/cover no-repeat;
            opacity: 0.5;
            z-index: 0;
            filter: blur(4px);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(120deg, #eaf6f0 0%, #f5f5f3 100%);
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }
        .form-container {
            background: rgba(255,255,255,0.92);
            padding: 38px 32px 32px 32px;
            border-radius: 22px;
            box-shadow: 0 10px 36px rgba(44, 76, 71, 0.17), 0 2px 8px rgba(44, 76, 71, 0.10);
            width: 100%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(60px) scale(0.97);
            animation: cardFadeIn 1.2s cubic-bezier(.42,0,.58,1) 0.1s forwards;
            box-sizing: border-box;
        }
        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .form-container:hover {
            box-shadow: 0 20px 48px rgba(44, 76, 71, 0.23), 0 2px 8px rgba(44, 76, 71, 0.10);
            transform: translateY(-6px) scale(1.015);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .form-container h2 {
            margin-bottom: 18px;
            font-weight: 700;
            color: #0f90c9;
            text-align: center;
            letter-spacing: 1px;
            font-size: 2rem;
        }
        .form-container h3 {
            margin-bottom: 16px;
            font-weight: 500;
            color: #2c4c47;
            text-align: left;
            width: 100%;
            font-size: 1.08rem;
        }
        label {
            display: block;
            color: #2c4c47;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 500;
        }
        input[type="password"] {
            width: 89%;
            padding: 12px 15px;
            margin-bottom: 22px;
            border: 1.5px solid #b3e0ef;
            background-color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            color: #23413b;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="password"]:focus {
            border-color: #0f90c9;
            background: #eaf6f0;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0f90c9 60%, #2c4c47 100%);
            color: #fff;
            border: none;
            font-size: 1.08rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(44, 76, 71, 0.10);
            transition: background 0.3s, box-shadow 0.3s;
        }
        button:hover {
            background: linear-gradient(90deg, #2c4c47 60%, #0f90c9 100%);
            box-shadow: 0 6px 18px rgba(15,144,201,0.13);
        }
        .flash {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .flash.success {
            background-color: #e7fbe9;
            color: #1e824c;
            border: 1px solid #b1e6c1;
        }
        .flash.error, .flash.danger {
            background-color: #fdeaea;
            color: #b32d2d;
            border: 1px solid #f5b5b5;
        }
        @media (max-width: 500px) {
            .form-container {
                padding: 24px 7vw 22px 7vw;
                max-width: 98vw;
            }
            .form-container h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Reset Your Password</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST" onsubmit="return validatePasswords();">
            <h3>Enter new password</h3>
            <label for="password">New Password</label>
            <input type="password" name="password" id="password" placeholder="Password"
                pattern="(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{6,}"
                title="Password must be at least 6 characters long and include 1 uppercase letter, 1 digit, and 1 special character (!@#$%^&*)."
                required>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password"
                required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
    <script>
        function validatePasswords() {
            var pw = document.getElementById('password').value;
            var cpw = document.getElementById('confirm_password').value;
            if (pw !== cpw) {
                alert("Passwords do not match!");
                document.getElementById('confirm_password').focus();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
