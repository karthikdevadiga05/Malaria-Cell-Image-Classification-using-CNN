<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #eaf6f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Background image with blur and overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: url('/static/images/bg-lab.jpg') center center/cover no-repeat;
            opacity: 0.5;
            z-index: 0;
            filter: blur(4px);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(120deg, #eaf6f0 0%, #f5f5f3 100%);
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }
        
        .header-bar {
  width: 100vw;
  background: #2c4c47;
  color: #fff;
  padding: 24px 0 20px 0;
  text-align: center;
  font-size: 1.6rem;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 0;
  box-shadow: 0 2px 10px rgba(44, 76, 71, 0.12);
  z-index: 10;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px; /* space between logo and text */
}

.header-logo {
  height: 38px;
  width: 38px;
  object-fit: contain;
  background: transparent;
  display: inline-block;
}

.header-title {
  display: inline-block;
}
        .back-link {
            position: absolute;
            left: 30px;
            top: 32px;
            z-index: 10;
            font-size: 1rem;
            background: rgba(255,255,255,0.7);
            border-radius: 24px;
            padding: 7px 16px;
            box-shadow: 0 2px 8px rgba(44, 76, 71, 0.10);
            transition: background 0.2s;
        }
        .back-link a {
            color: #2c4c47;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .back-link:hover {
            background: #eaf6f0;
        }
        
        /* Animated forgot password card */
        .forgot-card {
            margin-top: 60px;
            margin-bottom: 60px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 10px 36px rgba(44, 76, 71, 0.17), 0 2px 8px rgba(44, 76, 71, 0.10);
            border-radius: 20px;
            padding: 32px 28px 24px 28px;
            max-width: 500px;
            width: 92vw;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 1.5px solid #eaf6f0;
            z-index: 2;
            opacity: 0;
            transform: translateY(60px) scale(0.97);
            animation: cardFadeIn 1.2s cubic-bezier(.42,0,.58,1) 0.1s forwards;
            box-sizing: border-box;
        }
        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .forgot-card:hover {
            box-shadow: 0 20px 48px rgba(44, 76, 71, 0.23), 0 2px 8px rgba(44, 76, 71, 0.10);
            transform: translateY(-6px) scale(1.015);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        
        .forgot-card h2 {
            margin-bottom: 25px;
            font-weight: 700;
            color: #23413b;
            text-align: center;
            font-size: 2rem;
        }
        
        form {
            width: 75%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            color: #2c4c47;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
        }
        
        input[type="text"], input[type="email"] {
            width: 93%;
            padding: 12px 15px;
            margin-bottom: 18px;
            border: 1.5px solid #cbe6f1;
            border-radius: 8px;
            background: #f5f5f3;
            font-size: 1rem;
            color: #1a1a1a;
            transition: border 0.2s, background 0.2s;
            outline: none;
        }
        input[type="text"]:focus, input[type="email"]:focus {
            border-color: #2c4c47;
            background: #eaf6f0;
        }
        input::placeholder {
            color: #999;
        }
        
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(90deg, #2c4c47 60%, #0f90c9 100%);
            color: #fff;
            font-size: 1.08rem;
            font-weight: 700;
            padding: 13px 0;
            border: none;
            border-radius: 8px;
            margin-top: 6px;
            margin-bottom: 8px;
            box-shadow: 0 2px 10px rgba(44, 76, 71, 0.10);
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        button[type="submit"]:hover {
            background: linear-gradient(90deg, #1e3330 60%, #1976d2 100%);
            box-shadow: 0 8px 24px rgba(44, 76, 71, 0.16);
        }
        
        .forgot-card p {
            text-align: center;
            font-size: 1rem;
            color: #444;
            margin: 18px 0 0 0;
        }
        .forgot-card a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .forgot-card a:hover {
            color: #0b4c8c;
            text-decoration: underline;
        }
        
        .flash {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 1rem;
            text-align: center;
        }
        .flash.success {
            background: #d4edda;
            color: #256029;
        }
        .flash.error, .flash.danger {
            background: #ffcdd2;
            color: #b71c1c;
        }
        
        @media (max-width: 600px) {
            .forgot-card {
                padding: 18px 6px 14px 6px;
                margin-top: 24px;
                margin-bottom: 24px;
            }
            .header-bar {
                font-size: 1.1rem;
                padding: 16px 0 12px 0;
            }
            .back-link {
                left: 10px;
                top: 12px;
                font-size: 0.95rem;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
<div class="header-bar">
  <img src="static/images/deepdx.png" alt="DeepDx Logo" class="header-logo" />
  <span class="header-title">DeepDx</span>
</div>
    
    <div class="forgot-card">
        <h2>Forgot Password</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="username">
                <img src="{{ url_for('static', filename='images/user.png') }}" alt="User Icon"
                    style="width: 20px; height: 22px; vertical-align: middle; margin-right: 8px;">
                Username
            </label>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label for="email">
                <img src="{{ url_for('static', filename='images/mail.png') }}" alt="Mail Icon"
                    style="width: 20px; height: 22px; vertical-align: middle; margin-right: 8px;">
                Email
            </label>
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <p><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</body>
</html>
